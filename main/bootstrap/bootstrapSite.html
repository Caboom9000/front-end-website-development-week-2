<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Basics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">  
    <link rel="stylesheet" href="styleBoot.css">
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-12 bg-danger header">News Website <br>Breaking stories, latest updates</div>
      </div>
        <div class="row">
        <div class="col-8 bg-light">Main Story - Large Image & Headline</div>
        <div class="col-4 bg-secondary">Side Story 1 <br>Side Story 2 <br>Side Story3</div>
      </div>
      <div class="row">
        <div class="col-3 bg-warning">Story 1</div>
        <div class="col-3 bg-warning">Story 2</div>
        <div class="col-3 bg-warning">Story 3</div>
        <div class="col-3 bg-warning">Story 4</div>
      </div>  
      <div class="row">
        <div class="col-4 bg-info">Lower Story 1</div>
        <div class="col-4 bg-info">Lower Story 2</div>
        <div class="col-4 bg-info">Lower Story 3</div>
      </div> 
      <div class="row">
        <div class="col-12 bg-dark footer"> © 2026 News Website - All Rights Reserved</div>
    </div>
  </body>
</html>
